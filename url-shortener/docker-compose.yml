services:
  db:
    image: postgres:16-alpine
    container_name: short_db
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short_user"]
      interval: 5s
      timeout: 5s
      retries: 5 
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - short_network
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: short_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - short_network

  backend:
    build: ./backend
    container_name: short_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - short_network
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: short_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - short_network
    ports:
      - "8080:80"

networks:
  short_network:
    driver: bridge

volumes:
  db_data:
