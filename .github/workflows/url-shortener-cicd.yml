name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'url-shortener/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./url-shortener/backend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/url-shortener-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./url-shortener/frontend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/url-shortener-frontend:latest

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd ~/docker-projects/Docker-project/url-shortener
            docker compose pull backend frontend
            docker compose up -d
